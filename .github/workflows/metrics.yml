name: Metrics

# Rendert den Contribution-Kalender als SVG und committet ihn nach assets/.
# Dadurch hängt das README an keiner fremden Infrastruktur.
#
# Hinweis: Mit dem Standard-GITHUB_TOKEN sind nur öffentliche Daten sichtbar.
# Für Auswertungen über private Repos (Sprachverteilung, Commit-Zahlen)
# braucht es ein PAT mit "repo"-Scope, hinterlegt als Secret METRICS_TOKEN.

on:
  schedule:
    # Cron laeuft in UTC, also 06:30 Sommerzeit bzw. 05:30 Winterzeit in
    # Berlin. Versetzt zu snake.yml, damit die beiden nicht kollidieren.
    - cron: "30 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"

# Standard fuer alle Jobs: nur lesen. Der Job unten hebt sich das
# contents: write selbst an, weil er die SVG committet.
permissions:
  contents: read

# Der Job committet selbst nach assets/. Ohne die Sperre koennen ein
# geplanter und ein manuell gestarteter Lauf gleichzeitig auf main schreiben.
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Contribution-Kalender
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/isocalendar.svg
          base: ""
          config_timezone: Europe/Berlin
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
