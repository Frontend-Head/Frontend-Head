name: Metrics

# Renders the contribution calendar as an SVG and commits it to assets/.
# That way the README does not depend on any third-party infrastructure.
#
# Note: with the default GITHUB_TOKEN only public data is visible.
# Stats across private repos (language breakdown, commit counts) need a PAT
# with the "repo" scope, stored as the secret METRICS_TOKEN.

on:
  schedule:
    # Cron runs in UTC, so 06:30 in summer and 05:30 in winter in Berlin.
    # Offset from snake.yml so the two do not collide.
    - cron: "30 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"

# Default for all jobs: read only. The job below raises itself to
# contents: write because it commits the SVG.
permissions:
  contents: read

# The job commits to assets/ itself. Without the lock, a scheduled and a
# manually started run could write to main at the same time.
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Contribution calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/isocalendar.svg
          base: ""
          config_timezone: Europe/Berlin
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
