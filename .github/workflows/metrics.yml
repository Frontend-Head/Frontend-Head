name: Metrics

# Rendert Contribution-Kalender und Sprachverteilung als SVG und committet sie
# nach assets/. Dadurch hängt das README an keiner fremden Infrastruktur.
#
# Beide Schritte committen selbst (Standardverhalten der Action), es gibt also
# zwei Bot-Commits pro Lauf. Dafür sind sie voneinander unabhängig: fällt einer
# aus, bleibt das andere SVG erhalten.
#
# Hinweis: Mit dem Standard-GITHUB_TOKEN sind nur öffentliche Daten sichtbar.
# Für Auswertungen über private Repos braucht es ein PAT mit "repo"-Scope,
# hinterlegt als Secret METRICS_TOKEN.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Der secrets-Kontext ist in if-Bedingungen nicht verfügbar, deshalb der
      # Umweg über eine Job-Variable.
      HAS_PAT: ${{ secrets.METRICS_TOKEN != '' && 'true' || 'false' }}
    steps:
      - name: Contribution-Kalender
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/isocalendar.svg
          base: ""
          config_timezone: Europe/Berlin
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Kein GITHUB_TOKEN-Fallback: öffentlich ist nur dieses Profil-Repo, die
      # Grafik würde also "JavaScript 100 %" behaupten. Das wäre falscher als
      # keine Grafik. Ohne PAT überspringt der Schritt sich deshalb - so bleibt
      # der Lauf grün, statt jeden Tag eine Fehlermail zu erzeugen.
      #
      # Zum Einschalten: PAT mit "repo"-Scope anlegen, als Secret
      # METRICS_TOKEN hinterlegen, dann greift der Schritt beim nächsten Lauf
      # von allein. Danach das <img> in README.md wieder einkommentieren.
      #
      # plugin_languages_indepth bleibt aus - es klont jedes Repo einzeln und
      # vervielfacht die Laufzeit; die Byte-Statistik der API genügt hier.
      - name: Sprachverteilung
        if: env.HAS_PAT == 'true'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/languages.svg
          base: ""
          config_timezone: Europe/Berlin
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
