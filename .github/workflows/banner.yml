name: Banner

# Stellt das Banner im README auf die Tageszeit um, die bei mir in Berlin gerade
# ist: wer nachts vorbeikommt, sieht das Nachtbild.
#
# Das README zeigt immer assets/banner-now.jpg. Dieser Workflow kopiert die
# passende Variante darauf. Fehlt eine Variante, wird auf assets/banner.jpg
# zurückgefallen - dadurch bleibt das README auch dann korrekt, wenn erst ein
# Teil der Bilder existiert. Neue Varianten einfach als
# assets/banner-morgen.jpg / -tag.jpg / -abend.jpg / -nacht.jpg ablegen, hier
# ist nichts anzupassen.

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: banner
  cancel-in-progress: true

jobs:
  banner:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Banner auf die Berliner Tageszeit setzen
        run: |
          set -eu

          slot=$(sh scripts/banner-slot.sh)
          source="assets/banner-$slot.jpg"

          if [ ! -f "$source" ]; then
            echo "Keine Variante für '$slot' vorhanden, nutze assets/banner.jpg."
            source="assets/banner.jpg"
          fi

          cp "$source" assets/banner-now.jpg

          # Nur committen, wenn sich die Bytes wirklich geändert haben - sonst
          # entsteht bei jedem der acht Läufe pro Tag ein leerer Commit.
          if git diff --quiet -- assets/banner-now.jpg; then
            echo "Banner ist schon '$slot' ($source), kein Commit nötig."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner-now.jpg
          git commit -m "Banner auf Tageszeit '$slot' umstellen"
          git push
