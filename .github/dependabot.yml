version: 2

# Haelt die Action-Versionen in den beiden Workflows aktuell.
# Ohne das laufen metrics.yml und snake.yml irgendwann auf gepinnten
# Versionen, die GitHub nicht mehr unterstuetzt.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    labels:
      - dependencies
    ignore:
      # lowlighter/metrics veroeffentlicht keine v4. Dependabot loest die
      # Major-Version trotzdem auf und schlaegt einen beweglichen Branch
      # statt eines Releases vor.
      - dependency-name: lowlighter/metrics
        update-types:
          - version-update:semver-major
