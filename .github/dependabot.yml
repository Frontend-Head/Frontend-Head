version: 2

# Keeps the action versions in both workflows up to date.
# Without this, metrics.yml and snake.yml eventually run on pinned
# versions that GitHub no longer supports.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    labels:
      - dependencies
    ignore:
      # lowlighter/metrics does not publish a v4. Dependabot resolves the
      # major version anyway and suggests a moving branch instead of a
      # release.
      - dependency-name: lowlighter/metrics
        update-types:
          - version-update:semver-major
